[package]
name = "autoreel-studio"
version = "0.1.0"
description = "AutoReel Studio — animated short films + multi-platform publish"
authors = ["AutoReel Studio"]
edition = "2021"

[lib]
name = "autoreel_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
